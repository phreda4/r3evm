name: CI r3evm

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      # 1. Dependencias para Linux (si usas SDL2 u otras librerías)
      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          make -f Makefile

      # 2. Dependencias para macOS (si usas SDL2)
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          make -f Makefile.mac

      # 4. Compilación en Windows usando tu Makefile.win específico
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          make -f Makefile.win

      # 5. Ejecutar pruebas (ajusta el comando según corresponda)
      - name: Run Tests
        run: |
          # Si tienes un target de test en tu makefile, puedes usar 'make test'
          # O ejecutar directamente el binario generado para verificar
          make test || true