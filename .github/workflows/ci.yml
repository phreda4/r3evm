name: CI r3evm

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-linux:
    name: Linux (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (Ubuntu)
        run: |
          make -f Makefile

      - name: Upload Binaries (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: r3evm-binaries-ubuntu-latest
          path: |
            r3lin
            r3lind

  build-macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (macOS)
        run: |
          make -f Makefile.mac

      - name: Upload Binaries (macOS)
        uses: actions/upload-artifact@v4
        with:
          name: r3evm-binaries-macos-latest
          path: |
            r3mac
            r3macd

  build-windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (Windows)
        run: |
          make -f Makefile.win

      - name: Upload Binaries (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: r3evm-binaries-windows-latest
          path: |
            r3.exe
            r3d.exe