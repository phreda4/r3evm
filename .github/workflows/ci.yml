name: CI r3evm

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Build (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          make -f Makefile

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          make -f Makefile.mac

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          make -f Makefile.win

      - name: Run Tests
        run: |
          # Si tu Makefile tiene un target 'test', se ejecutará aquí.
          # Si falla, la CI fallará correctamente para avisarte.
          # make test

      - name: Upload Binaries
        uses: actions/upload-artifact@v4
        with:
          name: r3evm-binaries-${{ matrix.os }}
          path: |
            r3lin
            r3lind
            r3mac
            r3macd
            r3.exe
            r3d.exe